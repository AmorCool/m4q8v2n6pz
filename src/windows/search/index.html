<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>搜索栏</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!--
        The address-bar dropdown.

        The original's `search-renderer` page (title 「搜索栏」) draws the same
        three regions: grouped result sections, a loading line, and an empty
        line. The panel is deliberately display-only -- the keyboard stays in
        the main window's address bar, so the highlight is moved by
        `onSearchKey` events rather than by local key listeners
        (SETTINGS_SEARCH_NOTIFY_SPEC.md section 2.3(1)).
    -->
    <div id="sections" class="sections"></div>
    <div id="loading" class="hint is-hidden">正在搜索本地/云盘文件…</div>
    <div id="empty" class="hint is-hidden">没有搜索到相关文件</div>

    <script src="index.js"></script>
</body>
</html>
