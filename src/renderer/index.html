<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>ThunderX</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!--
        Two screens, one window.

        The login screen is drawn until a session exists and the task UI is
        not; which one is up is decided by the server (IsLogined), so the
        window cannot disagree with the rest of the client about the session.
        The card is 600x440 because that is the size the original's login
        window is, and keeping it means the layout does not have to be redone
        if this ever moves into a window of its own.
    -->
    <section id="login" class="login">
        <!-- 返回按钮. 登录页现在是主动进的, 就必须能退出去 -- 之前只能靠登录成功
             或退出登录才离开, 未登录的人进去就出不来. 迅雷不强制登录, 所以这里
             必须有一个"不登了, 回去下载"的出口. -->
        <button id="login-back" class="login-back" type="button">返回</button>
        <div class="login-card">
            <!-- Brand column. The mark is a placeholder: the original's icon
                 assets are not part of this repository. -->
            <div class="login-brand">
                <div class="login-mark">T</div>
                <div class="login-wordmark">ThunderX</div>
                <div class="login-version" id="login-version"></div>
            </div>

            <!-- Form column. Tab order and default follow the original: QR
                 first, because it is the path that is offered by default. -->
            <div class="login-panel">
                <nav class="login-tabs">
                    <button class="login-tab is-active" type="button" data-tab="qr">扫码登录</button>
                    <button class="login-tab" type="button" data-tab="password">账号密码</button>
                    <button class="login-tab" type="button" data-tab="phone">手机验证</button>
                </nav>

                <!-- Tab 1: QR. The image slot is kept even though nothing can
                     fill it yet, so the layout matches the original. -->
                <div class="login-pane" data-pane="qr">
                    <div class="qr-box">
                        <img id="qr-image" class="qr-image is-hidden" alt="登录二维码">
                        <div id="qr-placeholder" class="qr-placeholder">二维码加载中…</div>
                    </div>
                    <p id="qr-status" class="login-hint">请使用迅雷 App 扫码</p>
                    <button id="qr-refresh" class="login-link" type="button">刷新二维码</button>
                </div>

                <!-- Tab 2: account + password. -->
                <div class="login-pane is-hidden" data-pane="password">
                    <label class="field">
                        <span class="field-label">账号</span>
                        <input id="login-account" type="text" spellcheck="false"
                               autocomplete="username" placeholder="手机号 / 迅雷账号">
                    </label>
                    <label class="field">
                        <span class="field-label">密码</span>
                        <span class="field-input">
                            <input id="login-password" type="password"
                                   autocomplete="current-password" placeholder="密码">
                            <button id="login-reveal" class="reveal" type="button">显示</button>
                        </span>
                    </label>
                    <!-- 图形验证码. 平时隐藏, 服务端要求时才出现 (风控触发).
                         原版在上一轮返回风控码时弹出图码面板, 见 LOGIN_PROTOCOL_SPEC
                         3.1 的 show_captch_panel. -->
                    <label class="field captcha-field is-hidden" id="login-captcha-field">
                        <span class="field-label">图形验证码</span>
                        <span class="field-input">
                            <input id="login-captcha" type="text" maxlength="8" spellcheck="false"
                                   placeholder="图片中的字符">
                        </span>
                    </label>
                    <label class="check">
                        <input id="login-remember" type="checkbox" checked> 记住账号
                    </label>
                    <button id="login-submit" class="login-primary" type="button">登录</button>
                    <p id="login-error" class="login-error"></p>
                </div>

                <!-- Tab 3: phone + code. -->
                <div class="login-pane is-hidden" data-pane="phone">
                    <label class="field">
                        <span class="field-label">手机号</span>
                        <input id="phone-number" type="tel" maxlength="11" spellcheck="false"
                               autocomplete="tel" placeholder="11 位手机号">
                    </label>
                    <label class="field">
                        <span class="field-label">验证码</span>
                        <span class="field-input">
                            <input id="phone-code" type="text" maxlength="6"
                                   autocomplete="one-time-code" placeholder="短信验证码">
                            <button id="phone-send" class="reveal" type="button">获取验证码</button>
                        </span>
                    </label>
                    <!-- 图形验证码, 同账号密码 tab. -->
                    <label class="field captcha-field is-hidden" id="phone-captcha-field">
                        <span class="field-label">图形验证码</span>
                        <span class="field-input">
                            <input id="phone-captcha" type="text" maxlength="8" spellcheck="false"
                                   placeholder="图片中的字符">
                        </span>
                    </label>
                    <label class="check">
                        <input id="phone-agree" type="checkbox"> 我已阅读并同意《用户协议》
                    </label>
                    <button id="phone-submit" class="login-primary" type="button" disabled>登录</button>
                    <p id="phone-error" class="login-error"></p>
                </div>

                <div class="login-foot">
                    <span class="login-link is-static">遇到问题？</span>
                </div>
            </div>
        </div>
    </section>

    <!--
        The task UI. Layout mirrors the original: a sidebar of filter entries,
        a toolbar, and the task table. The plugin views sit in a container of
        their own so that mounting one cannot disturb the task list.
    -->
    <div id="app" class="is-hidden">
        <aside id="sidebar">
            <div class="brand">ThunderX</div>
            <nav id="filters">
                <button id="open-pan" class="sidebar-action" type="button">云盘</button>
                <button id="open-settings" class="sidebar-action" type="button">设置</button>
                <button class="filter is-active" data-status="all">全部</button>
                <button class="filter" data-status="active">正在下载</button>
                <button class="filter" data-status="waiting">等待中</button>
                <button class="filter" data-status="paused">已暂停</button>
                <button class="filter" data-status="done">已完成</button>
                <button class="filter" data-status="error">失败</button>
            </nav>
            <div id="account" class="account">
                <span id="account-name">未登录</span>
                <span id="account-vip" class="vip-badge is-hidden"></span>
                <button id="signin" class="logout" type="button">登录</button>
                <button id="logout" class="logout is-hidden" type="button">退出</button>
            </div>
        </aside>

        <main id="content">
            <header id="toolbar">
                <input id="url" type="text" placeholder="粘贴链接或磁力链接" spellcheck="false">
                <button id="add">新建</button>
                <button id="pause">暂停</button>
                <button id="resume">开始</button>
                <button id="remove">删除</button>
            </header>

            <div id="banner" class="banner is-hidden"></div>

            <table id="tasks">
                <thead>
                    <tr>
                        <th class="col-name">名称</th>
                        <th class="col-size">大小</th>
                        <th class="col-progress">进度</th>
                        <th class="col-speed">速度</th>
                        <th class="col-status">状态</th>
                    </tr>
                </thead>
                <tbody id="tasks-body"></tbody>
            </table>

            <div id="empty" class="empty">还没有任务</div>

            <!-- Plugin views. Hidden until a plugin asks for one. -->
            <div id="views"></div>
        </main>
    </div>

    <!--
        Toast (应用内浮条).

        The original's `.xly-down-bar` component (renderer.js:45508-45542, CSS
        in main-renderer/renderer.css). It sits OUTSIDE `#app` on purpose: it
        belongs to the window, not to a screen, so a notice raised on the login
        screen is not unmounted when the task list replaces it. Position, size
        and colours are copied from the original's stylesheet.

        The close mark is a text glyph rather than the original's icon font
        (`td-icon-close`): the font is not part of this repository, and a bar
        with no way to dismiss it would be worse than an approximate glyph.
    -->
    <div id="toast" class="xly-down-bar is-hidden">
        <p id="toast-text" class="xly-down-bar__text"></p>
        <div class="xly-down-bar__option">
            <a id="toast-action" class="xly-down-bar__button is-hidden"
               role="button" tabindex="0">查看</a>
            <a id="toast-close" class="xly-down-bar__close" role="button"
               tabindex="0" title="关闭">✕</a>
        </div>
    </div>

    <!--
        The three notification modules load before the page script because the
        page builds its managers from them at start-up. They are plain scripts
        rather than modules so that the same files can be `require`d by the
        test suite (see the dual-mode footer in each).
    -->
    <script src="msg-queue.js"></script>
    <script src="pop-mutual.js"></script>
    <script src="toast.js"></script>
    <script src="index.js"></script>
</body>
</html>
