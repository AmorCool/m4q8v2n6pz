name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    # Mapped to an environment variable because `secrets` cannot be read from an
    # `if:` directly.
    env:
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: npm run lint

      # Fetch the engine, so the tests that need one are not skipped.
      #
      # They skip with a stated reason when bin/ is empty, and bin/ is empty
      # here by default: the engine is built in another repository and the
      # token this workflow receives is scoped to this one. Set ENGINE_TOKEN to
      # a token that can read AmorCool/k7m3p9x2qv and these tests run for real
      # -- which matters, because a stub answers to every name and hid six
      # defects in the engine at once.
      - name: Fetch the download engine
        if: env.ENGINE_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: npm run engine:fetch

      - name: Smoke test
        run: npm test

      - name: Boot check
        shell: pwsh
        env:
          TL_OUTPUT: console
          TL_APPID: ci-app
          TL_APPKEY: ci-key
        run: |
          # The app runs until interrupted, so start it, give it time to boot,
          # then stop it. A non-zero exit from the timeout path is expected.
          $p = Start-Process node -ArgumentList 'src/main/index.js' -PassThru -NoNewWindow -RedirectStandardOutput boot.log -RedirectStandardError boot.err
          Start-Sleep -Seconds 4
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content boot.log
          if (-not (Select-String -Path boot.log -Pattern 'booted' -Quiet)) {
            Get-Content boot.err
            throw 'application did not reach the booted state'
          }
